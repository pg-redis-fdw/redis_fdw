name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Supersede a PR's earlier runs when it is pushed again: a stacked-branch
# rebase force-pushes several branches at once, and every run it displaces is
# testing content that no longer exists. Master is excluded by folding run_id
# into its group, so each commit on master keeps its own completed run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Remove any preinstalled PostgreSQL
        run: sudo apt-get purge -y 'postgresql*' || true

      # --retry-all-errors is the flag that matters, not --retry. curl only
      # retries what it considers transient - timeouts and 408/429/5xx - so a
      # dropped TLS connection (exit 55, "SSL_read: unexpected eof") is NOT
      # retried by --retry alone, and that is the failure this guards against.
      # Acquire::Retries covers the same class of blip in the apt-get fetch
      # that follows.
      - name: Add the PostgreSQL APT repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
               --retry 5 --retry-delay 2 --retry-all-errors \
               https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get -o Acquire::Retries=3 update

      # Install PostgreSQL and Valkey from their standard release packages -
      # only redis_fdw itself is built from source here. Valkey is the
      # actively-developed, license-compatible fork of Redis; libhiredis
      # still works against it since Valkey speaks the same RESP wire
      # protocol.
      #
      # The test scripts invoke `redis-cli`, which Valkey ships as
      # `valkey-cli`. We used to get that name from valkey-redis-compat, but
      # that package is in noble only: when ubuntu-latest moved to 26.04 it
      # stopped existing and every job in the matrix died at this step. Make
      # the symlink ourselves instead, from valkey-tools, which is present in
      # every release that has valkey-server at all.
      - name: Remove any preinstalled Redis
        run: sudo apt-get purge -y 'redis-*' || true

      - name: Install PostgreSQL ${{ matrix.pg }}, Valkey, and hiredis
        run: |
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            postgresql-client-${{ matrix.pg }} \
            valkey-server \
            valkey-tools \
            libhiredis-dev

      - name: Provide the redis-cli name the test scripts expect
        run: sudo ln -sf "$(command -v valkey-cli)" /usr/local/bin/redis-cli

      - name: Put the PostgreSQL binaries on PATH
        run: echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"

      - name: Build redis_fdw
        run: make

      - name: Install redis_fdw
        run: sudo env "PATH=$PATH" make install

      - name: Allow local trust authentication for the test run
        run: |
          sudo tee /etc/postgresql/${{ matrix.pg }}/main/pg_hba.conf > /dev/null <<'EOF'
          local   all             all                                     trust
          host    all             all             127.0.0.1/32            trust
          host    all             all             ::1/128                 trust
          EOF
          sudo pg_ctlcluster ${{ matrix.pg }} main restart

      - name: Create a superuser role for the CI user
        run: sudo -u postgres createuser -s "$(whoami)"

      # Record what we are actually testing against. The expected files are
      # compared byte for byte, and some of them assert text and ordering that
      # the server chooses, so a distro server upgrade can turn the suite red
      # on its own. When that happens the version in this log is the first
      # thing you want.
      - name: Confirm Valkey is available, and say which one
        run: |
          lsb_release -ds
          valkey-cli ping
          redis-cli ping
          valkey-cli info server | grep -E 'valkey_version|redis_version'

      # pg_regress aborts without writing regression.diffs if its own diff
      # cannot run - a missing expected file does that - so dump whatever
      # exists rather than letting `cat` fail and hide the real cause.
      - name: Run regression tests
        run: |
          make installcheck || {
            cat test/regression.diffs test/log/*.log 2>/dev/null
            exit 1
          }
